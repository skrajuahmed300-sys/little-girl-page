<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>然然的网站</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; }
  nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid #2a2a4a; }
  nav .logo { font-size: 1.4em; font-weight: 700; color: #fff; letter-spacing: 2px; }
  nav .links a { color: #888; text-decoration: none; margin-left: 30px; font-size: 0.95em; transition: color 0.2s; }
  nav .links a:hover { color: #fff; }
  .main { display: flex; max-width: 1000px; margin: 60px auto; padding: 0 40px; gap: 60px; align-items: center; }
  .main .photo img { width: 260px; height: 260px; object-fit: cover; border-radius: 50%; border: 2px solid #333; }
  .main .text h1 { font-size: 2.4em; font-weight: 700; color: #fff; margin-bottom: 10px; }
  .main .text .tag { display: inline-block; background: #16213e; color: #5c9eff; padding: 4px 14px; border-radius: 3px; font-size: 0.85em; margin-bottom: 20px; }
  .main .text p { font-size: 1.05em; line-height: 1.8; color: #999; max-width: 480px; }
  .section { max-width: 1000px; margin: 0 auto; padding: 0 40px 60px; }
  .section h2 { font-size: 1.3em; color: #5c9eff; margin-bottom: 24px; text-transform: uppercase; letter-spacing: 3px; border-bottom: 1px solid #2a2a4a; padding-bottom: 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
  .grid-item { background: #16213e; border-radius: 4px; padding: 24px; border: 1px solid #2a2a4a; }
  .grid-item .label { font-size: 0.8em; color: #666; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; }
  .grid-item .value { font-size: 1.1em; color: #ccc; }
  footer { text-align: center; padding: 30px 40px; color: #555; font-size: 0.85em; border-top: 1px solid #2a2a4a; }
  @media (max-width: 700px) { .main { flex-direction: column; text-align: center; gap: 30px; } .main .text p { max-width: 100%; } nav { padding: 15px 20px; } }
</style>
</head>
<body>
<nav>
  <div class="logo">RAN</div>
  <div class="links"><a href="#">首页</a><a href="#">相册</a><a href="#">关于</a></div>
</nav>
<div class="main">
  <div class="photo"><img src="girl.jpg" alt="然然"></div>
  <div class="text">
    <h1>然然</h1>
    <span class="tag">· 2023 / 05 ·</span>
    <p>然然，，2023年5月出生。天真烂漫，乖巧可爱，是全家人的开心果。喜欢画画、听故事、和小动物玩耍。每一天都在快乐成长。</p>
  </div>
</div>
<div class="section">
  <h2>信息</h2>
  <div class="grid">
    <div class="grid-item"><div class="label">生日</div><div class="value">2023 年 5 月</div></div>
    <div class="grid-item"><div class="label">星座</div><div class="value">金牛座</div></div>
    <div class="grid-item"><div class="label">爱好</div><div class="value">画画 / 听故事</div></div>
    <div class="grid-item"><div class="label">城市</div><div class="value">中国</div></div>
  </div>
</div>
<footer><p>然然的网站 © 2026</p></footer>
</body>
</html>
