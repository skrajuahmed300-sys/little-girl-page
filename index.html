<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小可爱的乐园</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(135deg, #fce4ec 0%, #f3e5f5 50%, #e8eaf6 100%);
    min-height: 100vh;
  }
  .hero { text-align: center; padding: 60px 20px 40px; }
  .hero h1 { font-size: 3em; color: #e91e63; margin-bottom: 10px; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .hero .subtitle { font-size: 1.5em; color: #ab47bc; font-weight: 300; }
  .photo-container { display: flex; justify-content: center; padding: 20px; }
  .photo-frame {
    border-radius: 20px; overflow: hidden; box-shadow: 0 20px 60px rgba(233,30,99,0.3);
    border: 8px solid white; max-width: 400px; transition: transform 0.3s ease;
  }
  .photo-frame:hover { transform: scale(1.03) rotate(-1deg); }
  .photo-frame img { display: block; width: 100%; height: auto; }
  .content { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
  .card {
    background: rgba(255,255,255,0.85); backdrop-filter: blur(10px);
    border-radius: 20px; padding: 40px; margin-bottom: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  }
  .card:hover { transform: translateY(-5px); }
  .card h2 { font-size: 1.8em; color: #7b1fa2; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 3px solid #e1bee7; }
  .card p { font-size: 1.1em; line-height: 2; color: #555; }
  .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
  .info-item {
    background: linear-gradient(135deg, #fce4ec, #f3e5f5); border-radius: 15px;
    padding: 25px; text-align: center; transition: transform 0.3s ease;
  }
  .info-item:hover { transform: scale(1.05); }
  .info-item .icon { font-size: 2.5em; margin-bottom: 10px; }
  .info-item .label { font-size: 0.9em; color: #888; margin-bottom: 5px; }
  .info-item .value { font-size: 1.2em; font-weight: bold; color: #7b1fa2; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; }
  .gallery-item {
    background: linear-gradient(135deg, #fce4ec, #e1bee7); border-radius: 15px;
    padding: 30px 20px; text-align: center; font-size: 2em; transition: transform 0.3s ease;
  }
  .gallery-item:hover { transform: scale(1.1); }
  .footer { text-align: center; padding: 40px 20px; color: #ab47bc; font-size: 0.9em; }
  .heart { color: #e91e63; animation: pulse 1.5s ease-in-out infinite; display: inline-block; }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }
  @media (max-width: 600px) { .hero h1 { font-size: 2em; } .card { padding: 25px; } }
</style>
</head>
<body>

<div class="hero">
  <h1>小可爱的乐园</h1>
  <p class="subtitle">记录成长的每一个瞬间</p>
</div>

<div class="photo-container">
  <div class="photo-frame">
    <img src="girl.jpg" alt="可爱的小女孩">
  </div>
</div>

<div class="content">

  <div class="card">
    <h2>关于小小</h2>
    <p>我叫小小，今年三岁啦！我是一个爱笑、爱撒娇的小公主。我的世界里充满了彩虹色的梦和甜甜的糖果。每天最开心的事情就是和爸爸妈妈一起去公园玩耍，看小猫、追蝴蝶，还有吃冰淇淋！</p>
  </div>

  <div class="info-grid">
    <div class="info-item">
      <div class="icon">Q</div>
      <div class="label">生日</div>
      <div class="value">2023年5月</div>
    </div>
    <div class="info-item">
      <div class="icon">Q</div>
      <div class="label">星座</div>
      <div class="value">金牛座</div>
    </div>
    <div class="info-item">
      <div class="icon">Q</div>
      <div class="label">爱好</div>
      <div class="value">画画唱歌</div>
    </div>
    <div class="info-item">
      <div class="icon">Q</div>
      <div class="label">最爱食物</div>
      <div class="value">草莓冰淇淋</div>
    </div>
  </div>

  <div class="card" style="margin-top:30px">
    <h2>宝藏收藏</h2>
    <div class="gallery">
      <div class="gallery-item">Q</div>
      <div class="gallery-item">Q</div>
      <div class="gallery-item">Q</div>
      <div class="gallery-item">Q</div>
      <div class="gallery-item">Q</div>
      <div class="gallery-item">Q</div>
    </div>
  </div>

  <div class="card">
    <h2>爸爸妈妈的话</h2>
    <p>亲爱的宝贝，你是上天赐给我们最珍贵的礼物。你的每一个微笑都像阳光一样温暖着我们的心。愿你永远健康快乐，在爱的包围中茁壮成长！</p>
  </div>

</div>

<div class="footer">
  <p>用心 <span class="heart">Q</span> 守护 用爱 <span class="heart">Q</span> 记录</p>
  <p style="margin-top:10px;color:#999">小小的成长日记 @ 2026</p>
</div>

</body>
</html>
